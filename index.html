 if(page==='front'){windowUI('anniversary_game.exe',`<div class="hero">${icon('game','hero-icon')}<span class="eyebrow">LOVE OS PRESENTS · VERSION 4.0</span><h1>Our Fourth<br>Anniversary<br>Game</h1><div class="ribbon">4 YEARS · 1 LOVE STORY</div><p class="lede">A little game made just for you, with four levels and a secret waiting at the end.</p>${CONFIG.anniversaryDate?`<span class="micro">${esc(CONFIG.anniversaryDate)}</span>`:''}${btn(state.started?'▶ CONTINUE GAME':'▶ START GAME',state.started?'hub':'welcome',false,false,true)}${state.started?btn('READ THE WELCOME AGAIN','welcome',true):''}<span class="micro">PLAYER TWO · YOU ♡</span></div>`);return}
 if(page==='welcome'){windowUI('welcome.exe',`<div class="welcome-layout"><figure class="welcome-photo"><div class="photo-title">♡ our_memory.jpg <span>□</span></div><img src="${esc(CONFIG.welcomePhoto)}" alt="The two of us together"><figcaption>Two players. One love story. ♡</figcaption></figure><div class="hero welcome-copy"><span class="eyebrow">A MESSAGE FOR PLAYER TWO</span><h1 style="font-size:clamp(27px,4vw,44px);text-transform:none">Welcome, my love ♡</h1><p class="lede welcome-message">${esc(CONFIG.welcome)}</p><p class="lede"><em>Ready, my Player Two?</em></p>${btn('OKAY ♡','begin',false,false,true)}${btn('◀ BACK','front',true)}</div></div>`,true);return}
 if(page==='hub'){windowUI('level_select.exe',head('MISSION CONTROL','Select your level','Complete each mission to unlock the next. Your progress is saved on this browser.')+`<div class="missiongrid">${levels.map((l,i)=>`<button class="mission ${completed(i+1)?'complete':''}" data-action="go:${l.route}" ${unlocked(i+1)?'':'disabled'}>${icon(unlocked(i+1)?l.icon:'lock')}<div><span class="lv">LEVEL 0${i+1}</span><h3>${l.title}</h3><p>${l.desc}</p><span class="status">${completed(i+1)?'✓ COMPLETED · REVISIT':unlocked(i+1)?'▶ UNLOCKED':'LOCKED · COMPLETE PREVIOUS LEVEL'}</span></div></button>`).join('')}</div><div class="actions">${btn('◀ TITLE SCREEN','front',true)}${count()===4?btn('VIEW ENDING','ending'):''}</div>`);return}
 if(page==='letters'){const all=completed(1);windowUI('level_01_love_letters.exe',head('LEVEL 01 · LOVE LETTERS','Pick a love letter','Open all three envelopes to unlock the mini-games.')+`<div class="envelopes">${CONFIG.letters.map((l,i)=>`<button class="envelope ${state.letters.includes(i)?'read':''}" data-action="letter:${i}" aria-label="Open letter ${i+1}: ${esc(l.title)}">${icon(state.letters.includes(i)?'open':'mail')}<h3>CARD 0${i+1}</h3><small>${state.letters.includes(i)?'✓ OPENED':'SEALED ♡'}</small></button>`).join('')}</div><div id="letterPanel" aria-live="polite">${openLetter>=0?`<div class="letter"><h3>${esc(CONFIG.letters[openLetter].title)}</h3><p id="letterText">${esc(CONFIG.letters[openLetter].body)}</p><span class="stamp">SEALED WITH LOVE ♡</span></div>`:`<div class="notice">${state.letters.length}/3 letters opened · Choose an envelope</div>`}</div>${all?'<div class="success"><h3>♡ HEART 01 UNLOCKED</h3><p>Mini Games is now available.</p></div>':''}${actions('hub','go:games',all)}`);return}
 if(page==='games'){windowUI('level_02_mini_games.exe',head('LEVEL 02 · MINI GAMES','The memory arcade','Complete all three challenges. Take your time; there are no penalties.')+`<div class="games">${[{key:'puzzle',title:'Put Us Together',desc:'Rearrange the nine pieces into one picture.',ico:'puzzle'},{key:'match',title:'Match Our Memories',desc:'Match four pairs from the same outings.',ico:'photos'},{key:'quiz',title:'Do You Remember?',desc:'Answer two questions about our memories.',ico:'question'}].map(g=>`<button class="gameitem" data-action="${g.key}">${icon(g.ico)}<div><h3>${g.title}</h3><p>${g.desc}</p></div><span class="tag ${state.games[g.key]?'done':''}">${state.games[g.key]?'✓ DONE':'PLAY ▶'}</span></button>`).join('')}</div>${completed(2)?'<div class="success"><h3>♡ HEART 02 UNLOCKED</h3><p>Our Memories is ready to explore.</p></div>':''}${actions('hub','go:memories',completed(2))}`);return}
 if(page==='puzzle'){initPuzzle();const solved=state.puzzle.every((v,i)=>v===i),src=image(CONFIG.puzzlePhoto,2);windowUI('mini_game_01_puzzle.exe',head('MINI GAME A','Put us together','Tap any two pieces to swap them. Rebuild the picture to win.')+`<div class="playarea"><div class="stats"><span>MOVES: ${state.puzzleMoves}</span><span>${solved?'SOLVED ✓':'3 × 3 PUZZLE'}</span></div><div class="puzzlewrap"><div class="puzzlegrid">${state.puzzle.map((v,i)=>`<button class="piece ${selected===i?'selected':''}" ${solved?'disabled':''} aria-label="Tile ${i+1}, piece ${v+1}" data-action="piece:${i}" style="background-image:url('${esc(src)}');background-position:${v%3*50}% ${Math.floor(v/3)*50}%"><span>${v+1}</span></button>`).join('')}</div><div class="reference"><span>REFERENCE</span><img src="${esc(src)}" alt="Complete puzzle picture">${CONFIG.puzzlePhoto?'':'<span>Sample illustration</span>'}</div></div>${solved?'<div class="success"><h3>PICTURE RESTORED!</h3><p>One mini-game completed.</p></div>':'<p class="notice">Use the small numbers as hints if you get stuck.</p>'}</div><div class="actions">${btn('◀ MINI GAMES','go:games',true)}${btn(solved?'PLAY AGAIN':'RESHUFFLE','reset:puzzle',true)}${solved?btn('NEXT MINI GAME ▶','match'):''}</div>`);return}
 if(page==='match'){initMatch();const solved=state.matched.length===8;windowUI('mini_game_02_memory_match.exe',head('MINI GAME B','Match our memories','Match two different photos taken on the same day and at the same place. Find all four memory pairs!')+`<div class="playarea"><div class="stats"><span>MOVES: ${state.matchMoves}</span><span>PAIRS: ${state.matched.length/2}/4</span></div><div class="cardgrid">${state.match.map((v,i)=>{let face=flipped.includes(i)||state.matched.includes(i);return `<button data-action="flip:${i}" class="matchcard ${face?'face':''} ${state.matched.includes(i)?'matched':''}" aria-label="${face?'Picture '+(v+1):'Hidden card '+(i+1)}" ${state.matched.includes(i)||flipped.includes(i)||flipped.length===2?'disabled':''}>${face?`<img src="${esc(image(CONFIG.matchPhotos[v],v))}" alt="Memory ${v+1}">`:icon('heart')}</button>`}).join('')}</div>${solved?'<div class="success"><h3>ALL PAIRS MATCHED!</h3><p>Another mini-game completed. ♡</p></div>':`<p class="notice">${flipped.length===2?'Not a match. Try again!':'Tap two cards to reveal the memories.'}</p>`}</div><div class="actions">${btn('◀ MINI GAMES','go:games',true)}${btn('PLAY AGAIN','reset:match',true)}${solved?btn('NEXT MINI GAME ▶','quiz'):''}</div>`);return}
 if(page==='quiz'){const i=state.quizIndex;if(i>=CONFIG.quiz.length){windowUI('mini_game_03_quiz.exe',head('MINI GAME C','Memory master!','You answered every question correctly.')+`<div class="surprise">${icon('trophy')}<h2>QUIZ COMPLETE</h2></div><div class="actions">${btn('◀ MINI GAMES','go:games',true)}${btn('REPLAY QUIZ','reset:quiz',true)}${btn('CONTINUE ▶','go:games')}</div>`);return}const q=CONFIG.quiz[i];windowUI('mini_game_03_quiz.exe',head('MINI GAME C','Do you remember?','Look at the picture and choose the correct answer.')+`<div class="playarea"><div class="stats"><span>QUESTION ${i+1}/${CONFIG.quiz.length}</span><span>NO TIME LIMIT ♡</span></div><img class="quizphoto" src="${esc(image(q.photo,q.art))}" alt="Memory for question ${i+1}"><h3 class="center" style="font-size:21px">${esc(q.question)}</h3><div class="choicegrid">${q.options.map((o,j)=>`<button class="choice ${quizChoice===j?(j===q.answer?'correct':'wrong'):''}" data-action="answer:${j}" ${quizChoice===q.answer?'disabled':''}>${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div><p class="notice" role="status">${esc(quizNotice||'Choose your answer.')}</p></div><div class="actions">${btn('◀ MINI GAMES','go:games',true)}${btn(i===CONFIG.quiz.length-1?'FINISH QUIZ ▶':'NEXT QUESTION ▶','quiz-next',false,quizChoice!==q.answer)}</div>`);return}
 if(page==='memories'){windowUI('level_03_our_memories.exe',head('LEVEL 03 · OUR MEMORIES','Four years of us','Some moments deserve to be lived twice. Scroll through our story.')+`<div class="timeline">${CONFIG.chapters.map((ch,i)=>`<section class="chapter"><span class="eyebrow">CHAPTER 0${i+1} · ${esc(ch.year)}</span><h3>${esc(ch.title)}</h3><p>${esc(ch.text)}</p><div class="photos">${ch.photos.map((p,j)=>`<figure class="polaroid"><img src="${esc(image(p.src,i+j))}" alt="${esc(p.caption)}" loading="lazy"><figcaption>${esc(p.caption)}</figcaption></figure>`).join('')}</div></section>`).join('')}</div><div class="timelineend"><span class="eyebrow">END OF CHAPTER 04</span><h3 style="font-size:29px">To be continued...</h3><p class="lede">Our next chapter is waiting.</p>${state.memory?'<span class="micro">✓ HEART 03 UNLOCKED</span>':btn('♡ I HAVE RELIVED OUR MEMORIES','finish-memories')}</div>${actions('hub','go:surprise',completed(3),'UNLOCK THE SURPRISE ▶')}`,true);return}
 if(page==='surprise'){if(state.surprise&&surpriseStep===0)surpriseStep=1;let body='';if(surpriseStep===0){body=head('LEVEL 04 · CLASSIFIED','The final surprise','LOVE OS has detected a hidden file.')+`<div id="terminal" class="terminal" aria-live="polite"></div><div class="actions">${btn('◀ BACK','hub',true)}${btn('OPEN SECRET FILE ▶','secret-next',false,!terminalReady)}</div>`}else if(surpriseStep===1){body=`<div class="surprise"><span class="eyebrow">FILE DECRYPTED · CHAPTER_05.EXE</span>${icon('folder')}<h2>One last file for you...</h2><p class="lede">You've unlocked something that wasn't part of the past.</p>${btn('OPEN OUR NEXT CHAPTER ♡','secret-next',false,false,true)}</div>${actions('hub')}`}else if(surpriseStep===2){body=`<div class="surprise"><span class="eyebrow">CHAPTER 05 · OUR FUTURE</span><h2>Our next chapter</h2>${CONFIG.video?`<video controls playsinline preload="metadata" aria-label="Our anniversary video" src="${esc(CONFIG.video)}"></video>`:`<div class="video-placeholder">${icon('play')}<strong>A personal video will go here</strong><span class="settingsinfo" style="color:#d8bdf0">Sample placeholder · replace with your own recording</span></div>`}<p class="lede">${esc(CONFIG.surpriseMessage)}</p>${btn('WHAT IS IT? ♡','secret-next')}</div>${actions('hub')}`}else{body=`<div class="surprise"><span class="eyebrow">YOUR REWARD · EXCLUSIVE INVITATION</span><h2>Would you be my date?</h2><div class="ticket"><span class="eyebrow">LOVE OS · ADMIT TWO</span><h3>${esc(CONFIG.dateTicket.title)}</h3><div class="perforation"></div><p><strong>You &amp; Me</strong></p><p class="lede">Destination: ${esc(CONFIG.dateTicket.destination)}<br>When: ${esc(CONFIG.dateTicket.when)}<br>Dress code: ${esc(CONFIG.dateTicket.dress)}</p><div class="barcode"></div><small class="micro">CHAPTER 05 · TICKET 0004</small></div>${btn('♡ ACCEPT THE DATE','finish-surprise',false,false,true)}${btn('SAVE THE IDEA FOR LATER','finish-surprise',true)}</div>${actions('hub')}`}windowUI('chapter_05.exe',body);if(surpriseStep===0)startTerminal();return}
 if(page==='ending'){windowUI('achievement_unlocked.exe',`<div class="surprise"><span class="eyebrow">ACHIEVEMENT UNLOCKED · 100%</span>${icon('trophy')}<h2>GAME COMPLETED!</h2><div class="ribbon">PLAYER TWO FOREVER</div><p class="lede">${esc(CONFIG.finalMessage)}</p><div class="sep" style="width:100%"></div><span class="micro">4/4 YEARS CELEBRATED<br>MEMORIES LEFT TO CREATE: ∞</span>${btn('♡ RETURN TO OUR STORY','hub')}${btn('REPLAY FROM THE BEGINNING','confirm-reset',true)}</div>`);return}

function startTerminal(){const lines=['Checking relationship files…','[✓] Year 01 memories recovered','[✓] Year 02 memories recovered','[✓] Year 03 memories recovered','[✓] Year 04 memories recovered','Searching for next chapter…','Hidden file detected: CHAPTER_05.exe','ACCESS GRANTED. ♥'];const el=document.getElementById('terminal');if(!el)return;function append(s){const d=document.createElement('div');d.textContent=s;if(s.startsWith('[✓]'))d.className='ok';if(s.includes('CHAPTER_05')||s.includes('ACCESS'))d.className='pink';el.append(d)}if(terminalReady){lines.forEach(append);return}let i=0;append(lines[i++]);terminalTimer=setInterval(()=>{if(i<lines.length)append(lines[i++]);if(i===lines.length){clearInterval(terminalTimer);terminalReady=true;const b=document.querySelector('[data-action="secret-next"]');if(b)b.disabled=false}},360)}
let typingTimer=null;function animateLetter(){clearInterval(typingTimer);const el=document.getElementById('letterText');if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const text=el.textContent;let pos=0;el.textContent='';typingTimer=setInterval(()=>{if(!el.isConnected){clearInterval(typingTimer);return}pos+=5;el.textContent=text.slice(0,pos);if(pos>=text.length)clearInterval(typingTimer)},15)}
function action(a){let [key,arg]=a.split(':');const n=Number(arg);if(key==='go'){go(arg);return}if(['front','welcome','hub','puzzle','match','quiz','ending'].includes(key)){go(key);return}if(key==='begin'){state.started=true;save();go('hub');return}if(key==='letter'){const before=completed(1);openLetter=n;if(!state.letters.includes(n))state.letters.push(n);save();render();animateLetter();if(!before&&completed(1))celebrate();return}if(key==='piece'){if(state.puzzle.every((v,i)=>v===i))return;if(selected===-1){selected=n;render();return}if(selected===n){selected=-1;render();return}[state.puzzle[selected],state.puzzle[n]]=[state.puzzle[n],state.puzzle[selected]];selected=-1;state.puzzleMoves++;if(state.puzzle.every((v,i)=>v===i))finishGame('puzzle');save();render();return}if(key==='flip'){if(flipped.length>=2||flipped.includes(n)||state.matched.includes(n))return;flipped.push(n);if(flipped.length===2){state.matchMoves++;if(Math.floor(state.match[flipped[0]]/2)===Math.floor(state.match[flipped[1]]/2)){state.matched.push(...flipped);flipped=[];if(state.matched.length===8)finishGame('match');save();render()}else{save();render();flipTimer=setTimeout(()=>{flipped=[];if(page==='match')render()},900)}}else render();return}if(key==='answer'){const q=CONFIG.quiz[state.quizIndex];if(quizChoice===q.answer)return;quizChoice=n;quizNotice=n===q.answer?'Correct! '+q.explain:'Not quite. Try again, you’ve got this!';render();return}if(key==='quiz-next'){if(quizChoice!==CONFIG.quiz[state.quizIndex]?.answer)return;state.quizIndex++;quizChoice=-1;quizNotice='';if(state.quizIndex>=CONFIG.quiz.length)finishGame('quiz');save();render();return}if(key==='reset'){if(arg==='puzzle'){state.puzzle=null;state.puzzleMoves=0;selected=-1}if(arg==='match'){clearTimeout(flipTimer);state.match=null;state.matched=[];state.matchMoves=0;flipped=[]}if(arg==='quiz'){state.quizIndex=0;quizChoice=-1;quizNotice=''}save();render();return}if(key==='finish-memories'){state.memory=true;save();render();celebrate();return}if(key==='secret-next'){if(surpriseStep===0&&!terminalReady)return;surpriseStep++;render();if(musicGain&&soundOn)musicGain.gain.value=1;window.scrollTo({top:0,behavior:'instant'});return}if(key==='finish-surprise'){state.surprise=true;save();go('ending');celebrate();return}if(key==='confirm-reset'){openModal('Reset your game?','This clears all saved letters, mini-games and unlocked levels on this browser. You can start a brand new adventure.',btn('CANCEL','close-modal',true)+btn('RESET GAME','reset-all'));return}if(key==='reset-all'){state=fresh();save();openLetter=-1;selected=-1;flipped=[];quizChoice=-1;quizNotice='';surpriseStep=0;terminalReady=false;closeModal();go('front');notify('New game ready.');return}if(key==='close-modal'){closeModal();return}if(key==='sound'){toggleSound();return}}
document.addEventListener('play',e=>{if(e.target.tagName==='VIDEO'&&musicGain)musicGain.gain.value=0},true);document.addEventListener('pause',e=>{if(e.target.tagName==='VIDEO'&&musicGain&&soundOn)musicGain.gain.value=1},true);document.addEventListener('ended',e=>{if(e.target.tagName==='VIDEO'&&musicGain&&soundOn)musicGain.gain.value=1},true);document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled){action(b.dataset.action);clickTone()}});document.getElementById('homeBtn').onclick=()=>go(state.started?'hub':'front');document.getElementById('settingsBtn').onclick=()=>openModal('Love OS Settings',`Sound is optional. Your game progress ${storageOK?'is saved locally in this browser.':'may not be saved because browser storage is unavailable.'} Your personal data is not sent anywhere by this game.`,btn(soundOn?'TURN SOUND OFF':'TURN SOUND ON','sound',true)+btn('RESET GAME','confirm-reset',true)+btn('CLOSE','close-modal'));function openModal(title,text,buttons){document.getElementById('overlay').innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><p>${esc(text)}</p><div class="actions" style="margin:0">${buttons}</div></section></div>`;document.querySelector('.modal button')?.focus()}function closeModal(){document.getElementById('overlay').innerHTML='';document.getElementById('settingsBtn').focus()}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.modal'))closeModal()});
// Optional original chiptune: synthesized locally, no audio files or autoplay.
let audioCtx=null,soundOn=false,musicTimer=null,musicGain=null,musicIndex=0;const melody=[60,64,67,72,67,64,62,65,69,74,69,65,59,62,67,71,67,62,60,64,67,72,76,72];function tone(midi,duration=.2,vol=.045,type='triangle'){if(!audioCtx||!soundOn||(document.querySelector('video') && !document.querySelector('video').paused))return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type;osc.frequency.value=440*Math.pow(2,(midi-69)/12);const t=audioCtx.currentTime;gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(vol,t+.025);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(gain).connect(musicGain||audioCtx.destination);osc.start(t);osc.stop(t+duration+.03)}function clickTone(){tone(84,.08,.025,'sine')}async function toggleSound(){if(soundOn){soundOn=false;clearInterval(musicTimer);if(musicGain)musicGain.gain.value=0}else{try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();musicGain=musicGain||audioCtx.createGain();musicGain.disconnect();musicGain.connect(audioCtx.destination);musicGain.gain.value=document.querySelector("video")&&!document.querySelector("video").paused?0:1;soundOn=true;tone(melody[musicIndex++%melody.length],.5,.035);musicTimer=setInterval(()=>{if(document.hidden)return;const n=melody[musicIndex++%melody.length];tone(n,.52,.035);if(musicIndex%4===1)tone(n-12,.8,.018,'sine')},420)}catch(e){notify('Sound is not available in this browser.')}}const b=document.getElementById('soundBtn');b.textContent=soundOn?'♫ SOUND ON':'♫ SOUND OFF';b.setAttribute('aria-pressed',String(soundOn));if(document.querySelector('.modal'))document.getElementById('settingsBtn').click()}document.getElementById('soundBtn').onclick=toggleSound;
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' ♡'}updateClock();clockTimer=setInterval(updateClock,30000);render();
